name: Security checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to scan (defaults to the triggering commit)
        required: false
        type: string
      use_docs_runner:
        description: Run documentation deployment checks on the self-hosted Linux X64 runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.10"
  SEMGREP_VERSION: "1.187.0"

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: inputs.use_docs_runner
        with:
          go-version: '1.26.x'
          cache: false

      - name: Scan checked-out source for secrets
        env:
          GITLEAKS_VERSION: v8.30.1
        run: go run "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION" dir --redact --no-banner .

  python:
    name: Python and Django security
    needs: secrets
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on Python
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off \
            --config p/python --config p/django django_rmq

      - name: Audit locked Python dependencies for supported runtimes
        run: |
          for python_version in 3.10 3.11 3.12 3.13 3.14 3.15; do
            uv audit --locked --python-version "$python_version"
          done

  javascript:
    name: JavaScript and TypeScript security
    needs: python
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on documentation JavaScript and TypeScript
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off \
            --config p/javascript --config p/typescript docs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/package.json
          package-manager-cache: false

      - name: Audit locked npm dependencies
        working-directory: docs
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm audit --package-lock-only --audit-level=low

  workflows:
    name: GitHub Actions security
    needs: javascript
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on GitHub Actions
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off \
            --config p/github-actions .github/workflows

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: inputs.use_docs_runner
        with:
          go-version: '1.26.x'
          cache: false

      - name: Check workflow and deployment script syntax
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          if ! command -v shellcheck >/dev/null; then
            UV_TOOL_DIR="$RUNNER_TEMP/shellcheck/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/shellcheck/bin" \
              uv tool install --python 3.13 'shellcheck-py==0.11.0.1'
            export PATH="$RUNNER_TEMP/shellcheck/bin:$PATH"
          fi
          if ! command -v jq >/dev/null; then
            mkdir -p "$RUNNER_TEMP/docs-tools"
            jq_path="$RUNNER_TEMP/docs-tools/jq"
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 --output "$jq_path"
            printf '%s  %s\n' '020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d' "$jq_path" | sha256sum --check
            chmod 700 "$jq_path"
            export PATH="$RUNNER_TEMP/docs-tools:$PATH"
          fi
          go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          for script in .github/docs/*.sh; do
            bash -n "$script"
          done
          shellcheck .github/docs/*.sh
          bash .github/docs/test-deploy.sh
