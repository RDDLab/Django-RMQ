name: Testing Django-RMQ pipeline

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected branch HEAD for an automatic dispatch
        type: string
        required: false
  workflow_call:
    inputs:
      source_sha:
        description: Commit to verify (defaults to the triggering commit)
        type: string
        required: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.10"

jobs:
  lint:
    name: Python lint, types and Django checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the dispatch commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::The branch advanced before the test workflow started."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.10

      - name: Run Ruff, Pyrefly and Django system checks
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: |
          uv run --locked --python 3.10 ruff check .
          uv run --locked --python 3.10 pyrefly check
          uv run --locked --python 3.10 python -m django check

  unit-test:
    name: Pytest (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_MANAGED_PYTHON: "true"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        django: [locked, minimum]
        include:
          - python: "3.10"
            django_min: "4.2"
          - python: "3.11"
            django_min: "4.2"
          - python: "3.12"
            django_min: "4.2.8"
          - python: "3.13"
            django_min: "5.1.3"
          - python: "3.14"
            django_min: "5.2.8"
          - python: "3.15"
            django_min: "6.1.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run tests with locked Django
        if: matrix.django == 'locked'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv run --locked --python "$PYTHON_VERSION" pytest

      - name: Run tests with minimum Django
        if: matrix.django == 'minimum'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_MIN: ${{ matrix.django_min }}
        run: uv run --locked --python "$PYTHON_VERSION" --with "django==$DJANGO_MIN" pytest

  package:
    name: Build wheel and source archive
    needs: [unit-test, integration-test, cluster-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build distributions
        run: uv build --python 3.10

  documentation:
    name: Verify English and Russian documentation
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/package.json
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Type-check the documentation
        working-directory: docs
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
          npm run docs:typecheck

      - name: Build and verify the documentation container
        env:
          DOCS_IMAGE: django-rmq-docs:ci
        run: |
          docker build --file .github/docs/Dockerfile --tag "$DOCS_IMAGE" .
          compose() {
            docker compose --project-name django-rmq-docs-ci --env-file /dev/null --file .github/docs/compose.yml "$@"
          }
          trap 'compose down' EXIT
          compose up --detach --wait --wait-timeout 90
          compose exec -T docs wget -q -O /dev/null http://docs:8080/
          compose exec -T docs wget -q -O /dev/null http://docs:8080/ru/

  integration-test:
    name: RabbitMQ integration (Python ${{ matrix.python }}, RabbitMQ ${{ matrix.rabbitmq }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        rabbitmq: ["3.13", "4.0", "4.1", "4.2", "4.3", "4.4"]
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}-management-alpine
        ports:
          - 5672/tcp
          - 15672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run broker integration tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          RMQ_PORT: ${{ job.services.rabbitmq.ports['5672'] }}
          RMQ_MGMT_PORT: ${{ job.services.rabbitmq.ports['15672'] }}
        run: uv run --locked --python "$PYTHON_VERSION" pytest -m "integration and not cluster"

  cluster-test:
    name: RabbitMQ cluster (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Start the cluster and run failover tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          compose() {
            docker compose --file .github/docker-compose.cluster.yml "$@"
          }
          trap 'compose down --volumes' EXIT
          compose up --detach --wait --wait-timeout 120
          compose exec -T rabbit1 rabbitmqctl await_online_nodes 3 --timeout 60
          uv run --locked --python "$PYTHON_VERSION" pytest -m cluster
