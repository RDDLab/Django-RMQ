name: Upload Django-RMQ Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Scan package revision
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ github.sha }}

  checks:
    name: Verify successful tests for main HEAD
    needs: security
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/tested-revision.yml
    with:
      source_sha: ${{ github.sha }}
      require_main_head: true

  release-build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Check package version, documentation archive, and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project --python 3.13 python .github/scripts/check_docs_version.py

      - name: Build distributions
        run: uv build --python 3.10

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/django-rmq

    steps:
      - name: Download distributions from artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Confirm the package revision is still main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Main advanced before publishing. Publish the new tested head of main."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  dispatch-docs:
    name: Trigger documentation deployment on main
    needs: pypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch documentation workflow for the published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f "source_sha=$GITHUB_SHA"
